name: Generate snake animation

on:
  # roda uma vez por dia (horário em UTC)
  schedule:
    - cron: "37 4 * * *"
  # permite rodar manualmente pela aba Actions
  workflow_dispatch:
  # roda a cada push na main
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate snake SVGs from the contribution graph
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#7c3aed
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#d946ef

      - name: Push the SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
